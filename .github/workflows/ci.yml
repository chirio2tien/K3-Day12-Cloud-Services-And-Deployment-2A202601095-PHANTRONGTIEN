name: CI

on:
  push:
  pull_request:

env:
  AGENT_API_KEY: ci-dummy
  REDIS_URL: fake://

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest (skip deploy / self-referential bonus)
        run: >
          pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -v

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t day12-agent:ci .

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN chưa cấu hình — bỏ qua deploy (CI vẫn xanh)."
            exit 0
          fi
          npm install -g @railway/cli
          railway up --service day12-agent
